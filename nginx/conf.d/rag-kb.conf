# rag-kb 生产反代：/api/* 与页面都走 Next；SSE 流式必须关缓冲
# 挂载位置：/etc/nginx/conf.d/rag-kb.conf（docker-compose.prod.yml 已挂载 nginx/conf.d）

server {
    listen 80;
    server_name _;

    # 请求体上限：入库接口可能提交较长文本（10 万字级）
    client_max_body_size 2m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ===== SSE 流式关键配置 =====
        # 关闭缓冲：否则 AI 回答会被 Nginx 攒成一大段一次性吐给浏览器
        proxy_buffering off;
        # 加大读上游超时：DeepSeek 生成长回答时可能超过默认 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 流式响应不要压缩（压缩会破坏 SSE 的增量推送）
        gzip off;
    }
}

